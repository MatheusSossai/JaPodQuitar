{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block titulo %}Entrar | Já Pod Quitar{% endblock %}
{% block conteudo %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-4">Entrar</h1>
          <form method="post">
            {{ csrf() }}
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" name="email"
                     value="{{ dados.get('email', '') }}" required autofocus>
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" value="sim" id="lembrar" name="lembrar">
              <label class="form-check-label" for="lembrar">Continuar conectado neste aparelho</label>
            </div>
            <button class="btn btn-jpq w-100" type="submit">Entrar</button>
          </form>
          <p class="small text-center mt-3 mb-0">Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
